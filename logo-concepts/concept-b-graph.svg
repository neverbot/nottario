<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="nottario">
  <defs>
    <linearGradient id="nb" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2da44e"/>
      <stop offset="1" stop-color="#1f6feb"/>
    </linearGradient>
  </defs>
  <!-- one continuous "n": left foot -> up -> shoulder -> right stem -> right foot -->
  <path d="M42 92 V52 C42 45 49 41 60 41 C73 41 84 50 84 63 V92"
        fill="none" stroke="url(#nb)" stroke-width="11"
        stroke-linecap="round" stroke-linejoin="round"/>
  <!-- graph nodes at the three vertices -->
  <g fill="url(#nb)">
    <circle cx="42" cy="52" r="10"/>
    <circle cx="42" cy="92" r="10"/>
    <circle cx="84" cy="92" r="10"/>
  </g>
  <g fill="#ffffff">
    <circle cx="42" cy="52" r="4.3"/>
    <circle cx="42" cy="92" r="4.3"/>
    <circle cx="84" cy="92" r="4.3"/>
  </g>
</svg>
