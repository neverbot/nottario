# Tier 1 SQL safety + general Go hygiene, in the golangci-lint v2
# schema. Migrated from the v1 config with `golangci-lint migrate`.
#
# The goal is to make hand-written SQL safe by default: gosec
# G201/G202/G203 fail the build on Sprintf/concat into Query/Exec,
# which is the only way an injection can sneak in given we use pgx
# with $N placeholders.
#
# Two v2 differences worth knowing:
#   - gosimple and stylecheck were folded into staticcheck, so
#     enabling staticcheck here is broader than it was under v1.
#   - gofmt moved from `linters` to `formatters`. It is still checked
#     by `golangci-lint run` and still fails the gate.
#
# Run via: make lint  (or  golangci-lint run)
version: "2"
run:
  timeout: 5m
  tests: true
linters:
  default: none
  enable:
    - errcheck
    - gosec
    - govet
    - ineffassign
    - staticcheck
    - unused
  settings:
    errcheck:
      check-type-assertions: false
      check-blank: false
    gosec:
      includes:
        - G201
        - G202
        - G203
        - G401
        - G402
        - G404
        - G501
        - G502
        - G505
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - gosec
        path: internal/skill/bundle.go
      - linters:
          - errcheck
          - gosec
          - staticcheck
          - unused
        path: .*\.gen\.go
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofmt
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
